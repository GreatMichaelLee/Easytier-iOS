name: Nightly (iPad)

on:
  push:
    branches:
      - ipad-jialiang-cert
  # 每天定时检查 main 有没有新提交(不管是直接push还是从官方合并进来的，只要
  # HEAD 变了就算)，没有就跳过整个build job，不浪费CI/不产生空release。
  # 跟私仓那边 builder/nightly.sh 的 crontab 错开，避免同时段发布造成混乱。
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = 北京时间凌晨02:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-ipad
  cancel-in-progress: true

env:
  SCHEME: EasyTier
  BUILD_CONFIGURATION: Release
  TEAM_ID: 98GVSDB894

jobs:
  # 只在定时触发时才需要判断"有没有变化"——push/手动触发本身就代表"该跑"，
  # 不需要额外判断。拿现有的 nightly tag(上次成功发布release时打的)当水位线，
  # 不用额外维护一个新的state文件。
  check-for-changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA=$(git rev-parse HEAD)
          LAST_SHA=$(git rev-parse refs/tags/nightly-ipad 2>/dev/null || echo "")
          if [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "no changes since last nightly release ($CURRENT_SHA), skip"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "new commits: ${LAST_SHA:-<none>} -> $CURRENT_SHA"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build and publish unsigned IPA
    needs: [check-for-changes]
    if: |
      always() &&
      (needs.check-for-changes.result == 'skipped' || needs.check-for-changes.outputs.has_changes == 'true')
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute build version
        shell: bash
        run: |
          set -euo pipefail
          # <date>-<short hash> of this repo's own history, same shape the
          # core/GUI builds use (see easytier-build-playbook.md). Replaces
          # GITHUB_RUN_NUMBER, which was just an opaque incrementing counter
          # with no way to tell which commit/day a build came from.
          DATE=$(git log -1 --format=%cd --date=format:%Y%m%d)
          HASH=$(git rev-parse --short=8 HEAD)
          BUILD_VERSION="${DATE}-${HASH}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${DATE}" >> "${GITHUB_ENV}"
          echo "BUILD_HASH=${HASH}" >> "${GITHUB_ENV}"
          # Filename mirrors the Windows/Android convention (see
          # easytier-build-playbook.md): "<product>-<version>.<ext>", all
          # hyphens, no platform tag, extension alone says what it's for.
          echo "UNSIGNED_IPA_NAME=easytier-${BUILD_VERSION}.ipa" >> "${GITHUB_ENV}"

      - name: Set up private core repo access (cargo -> GreatMichaelLee/Easytier)
        env:
          CORE_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/core_ci_key
          printf '%s\n' "$CORE_SSH_KEY" > ~/.ssh/core_ci_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'EOF'
          Host github.com-easytier-core
            HostName github.com
            User git
            IdentityFile ~/.ssh/core_ci_key
            IdentitiesOnly yes
          EOF
          git config --global \
            url."git@github.com-easytier-core:GreatMichaelLee/Easytier.git".insteadOf \
            "https://github.com/GreatMichaelLee/Easytier.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Select Xcode and install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "ARCHIVE_PATH=${RUNNER_TEMP}/EasyTier.xcarchive" >> "${GITHUB_ENV}"
          echo "PACKAGE_PATH=${RUNNER_TEMP}/package" >> "${GITHUB_ENV}"
          echo "EXPORT_PATH=${RUNNER_TEMP}/export" >> "${GITHUB_ENV}"

          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

          rustup target add aarch64-apple-ios
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi

          rustc --version
          protoc --version

      - name: Archive unsigned Release build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project EasyTier.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${BUILD_VERSION}"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${ARCHIVE_PATH}/Products/Applications/EasyTier.app"
          mkdir -p "${PACKAGE_PATH}/Payload" "${EXPORT_PATH}"
          cp -R "${APP_PATH}" "${PACKAGE_PATH}/Payload/EasyTier.app"

          (
            cd "${PACKAGE_PATH}"
            /usr/bin/zip -qry "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}" Payload
          )

          ( cd "${EXPORT_PATH}" && shasum -a 256 "${UNSIGNED_IPA_NAME}" > "${UNSIGNED_IPA_NAME}.sha256" )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easytier-${{ env.BUILD_VERSION }}
          path: |
            ${{ runner.temp }}/export/${{ env.UNSIGNED_IPA_NAME }}
            ${{ runner.temp }}/export/${{ env.UNSIGNED_IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Update rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_NOTES="${RUNNER_TEMP}/nightly-release-notes.md"

          {
            echo "Automated Release build from [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "- Build configuration: \`${BUILD_CONFIGURATION}\`"
            echo "- Code signing: none (genuinely unsigned, sign it yourself)"
            echo "- Built: ${BUILD_TIME}"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "> \`${UNSIGNED_IPA_NAME}\` is genuinely unsigned -- sign it yourself with your own Apple Developer account/provisioning profile (Xcode, AltStore, Sideloadly, etc.) before installing."
          } > "${RELEASE_NOTES}"

          git tag --force nightly-ipad "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly-ipad

          if gh release view nightly-ipad >/dev/null 2>&1; then
            gh release edit nightly-ipad \
              --target "${GITHUB_SHA}" \
              --title "iOS build ${BUILD_DATE} (${BUILD_HASH})" \
              --notes-file "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false

            # The IPA filename embeds <date>-<hash>, which changes on every commit
            # (unlike Windows/Android, where a same-day rebuild reuses the same
            # name and --clobber below just overwrites it in place). Without this,
            # every push leaves the previous build's ipa/sha256 behind forever --
            # caught 2026-09-13 with two different builds' files sitting on the
            # rolling "nightly" release at once. Delete every old easytier-*.ipa*
            # asset except the one we're about to upload.
            gh release view nightly-ipad --json assets -q '.assets[].name' | \
              grep -E '^easytier-[0-9]{8}-[0-9a-f]{8}\.ipa(\.sha256)?$' | \
              grep -v -F "${UNSIGNED_IPA_NAME}" | \
              while read -r old; do
                gh release delete-asset nightly-ipad "$old" --yes 2>/dev/null || true
              done

            gh release upload nightly-ipad \
              "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}" \
              "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}.sha256" \
              --clobber
            gh release delete-asset nightly-ipad EasyTier-nightly-trollstore.ipa --yes 2>/dev/null || true
          else
            gh release create nightly-ipad \
              "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}" \
              "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}.sha256" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "iOS build ${BUILD_DATE} (${BUILD_HASH})" \
              --notes-file "${RELEASE_NOTES}" \
              --prerelease \
              --latest=false
          fi
