name: Nightly

on:
  push:
    branches:
      - main
  # 每天定时检查 main 有没有新提交(不管是直接push还是从官方合并进来的，只要
  # HEAD 变了就算)，没有就跳过整个build job，不浪费CI/不产生空release。
  # 跟私仓那边 builder/nightly.sh 的 crontab 错开，避免同时段发布造成混乱。
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = 北京时间凌晨02:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

env:
  SCHEME: EasyTier
  BUILD_CONFIGURATION: Release
  TEAM_ID: Z78N6GQ84P

jobs:
  # 只在定时触发时才需要判断"有没有变化"——push/手动触发本身就代表"该跑"，
  # 不需要额外判断。拿现有的 nightly tag(上次成功发布release时打的)当水位线，
  # 不用额外维护一个新的state文件。
  check-for-changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA=$(git rev-parse HEAD)
          # 2026-09-29: 以前拿 "nightly" 这个浮动 release 标签当水位线，但那个
          # 标签现在被拆掉了（改成每个 build 号一页、见下面 build-number 那段），
          # 换一个专门只用来记"上次检查到的 commit"、不代表任何 release 的独立
          # 标签，两件事不再绑在一起。
          LAST_SHA=$(git rev-parse refs/tags/nightly-last-checked 2>/dev/null || echo "")
          if [ "$CURRENT_SHA" = "$LAST_SHA" ]; then
            echo "no changes since last nightly check ($CURRENT_SHA), skip"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "new commits: ${LAST_SHA:-<none>} -> $CURRENT_SHA"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-release:
    name: Build and publish unsigned IPA
    needs: [check-for-changes]
    if: |
      always() &&
      (needs.check-for-changes.result == 'skipped' || needs.check-for-changes.outputs.has_changes == 'true')
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Allocate build number
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 2026-09-29: 用户要求跟主仓库（GreatMichaelLee/Easytier）一样加一个
          # 跨发布共享的 Build 号。这里用的是独立的一套计数器
          # (easytier-ios-build-<N>，不是主仓库的 easytier-build-<N>)——这个仓库
          # 是完全独立的发布节奏（core crate 是浮动拉 main 的 tip，不是跟主仓库
          # 某个具体 commit 锁定发布），跟 Windows/Android 共用一个计数器只会两边
          # 都产生confusing的号码跳跃，没有实际意义。
          #
          # 计数器实现原理跟主仓库 builder/lib-build-number.sh 一致：带注释标签
          # 存最大号，同一个 commit 重新发布复用原号，删 release 不删标签所以号
          # 不会倒退。
          PREFIX="easytier-ios-build-"
          git fetch origin --tags --quiet
          COMMIT="${GITHUB_SHA}"
          MAX_N=0
          FOUND_N=""
          for tag in $(git tag -l "${PREFIX}*"); do
            n="${tag#$PREFIX}"
            case "$n" in ''|*[!0-9]*) continue ;; esac
            n_dec=$((10#$n))
            [ "$n_dec" -gt "$MAX_N" ] && MAX_N="$n_dec"
            tag_commit="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            if [ "$tag_commit" = "$COMMIT" ]; then
              FOUND_N="$n_dec"
            fi
          done
          if [ -n "$FOUND_N" ]; then
            BUILD_NUM="$FOUND_N"
            echo "commit already has ${PREFIX}${BUILD_NUM}, reusing"
          else
            BUILD_NUM=$((MAX_N + 1))
            NEW_TAG="${PREFIX}${BUILD_NUM}"
            git tag -a "$NEW_TAG" "$COMMIT" -m "EasyTier iOS nightly build $BUILD_NUM"
            git push origin "refs/tags/$NEW_TAG"
            echo "allocated new ${NEW_TAG}"
          fi
          printf -v BUILD_NUM_PADDED '%03d' "$BUILD_NUM"
          echo "BUILD_NUM=${BUILD_NUM}" >> "${GITHUB_ENV}"
          echo "BUILD_NUM_PADDED=${BUILD_NUM_PADDED}" >> "${GITHUB_ENV}"

      - name: Compute build version
        shell: bash
        run: |
          set -euo pipefail
          # <date>-<short hash>-Build <NNN>, same shape the core/GUI builds
          # use (see easytier-build-playbook.md) plus the Build number from
          # the step above. Unlike HomeLink/n2n, EasyTier's own version field
          # has no length limit and no app-name-prefix convention to strip,
          # so this one string is used everywhere (CURRENT_PROJECT_VERSION,
          # displayed in Settings) -- no separate "protocol version".
          #
          # NOTE: this whole <date>-<hash>-Build<N> scheme is only safe for
          # this genuinely-unsigned, never-submitted-to-the-App-Store nightly
          # channel. CURRENT_PROJECT_VERSION on any build that actually goes
          # through App Store Connect (see ci_scripts/ci_post_clone.sh) must
          # stay a plain incrementing integer -- Apple's validator rejects
          # anything else. Not touched here; this workflow is nightly-only.
          DATE=$(git log -1 --format=%cd --date=format:%Y%m%d)
          HASH=$(git rev-parse --short=8 HEAD)
          BUILD_VERSION="${DATE}-${HASH}-Build ${BUILD_NUM_PADDED}"
          echo "BUILD_VERSION=${BUILD_VERSION}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${DATE}" >> "${GITHUB_ENV}"
          echo "BUILD_HASH=${HASH}" >> "${GITHUB_ENV}"
          # Filename mirrors the Windows/Android convention (see
          # easytier-build-playbook.md): "<product>-<version>.<ext>", all
          # hyphens, no platform tag, extension alone says what it's for.
          # Space before the build number is stripped for the filename only
          # ("...-Build015.ipa" not "...-Build 015.ipa"), display keeps the
          # space -- explicit ask, mirrors the main repo's publish-release.sh.
          FILE_VERSION="${BUILD_VERSION// /}"
          echo "UNSIGNED_IPA_NAME=easytier-iphone-${FILE_VERSION}.ipa" >> "${GITHUB_ENV}"

      - name: Set up private core repo access (cargo -> GreatMichaelLee/Easytier)
        env:
          CORE_SSH_KEY: ${{ secrets.CORE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/core_ci_key
          printf '%s\n' "$CORE_SSH_KEY" > ~/.ssh/core_ci_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<'EOF'
          Host github.com-easytier-core
            HostName github.com
            User git
            IdentityFile ~/.ssh/core_ci_key
            IdentitiesOnly yes
          EOF
          git config --global \
            url."git@github.com-easytier-core:GreatMichaelLee/Easytier.git".insteadOf \
            "https://github.com/GreatMichaelLee/Easytier.git"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

      - name: Select Xcode and install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "ARCHIVE_PATH=${RUNNER_TEMP}/EasyTier.xcarchive" >> "${GITHUB_ENV}"
          echo "PACKAGE_PATH=${RUNNER_TEMP}/package" >> "${GITHUB_ENV}"
          echo "EXPORT_PATH=${RUNNER_TEMP}/export" >> "${GITHUB_ENV}"

          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version

          rustup target add aarch64-apple-ios
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi

          rustc --version
          protoc --version

      - name: Archive unsigned Release build
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project EasyTier.xcodeproj \
            -scheme "${SCHEME}" \
            -configuration "${BUILD_CONFIGURATION}" \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${BUILD_VERSION}"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="${ARCHIVE_PATH}/Products/Applications/EasyTier.app"
          mkdir -p "${PACKAGE_PATH}/Payload" "${EXPORT_PATH}"
          cp -R "${APP_PATH}" "${PACKAGE_PATH}/Payload/EasyTier.app"

          (
            cd "${PACKAGE_PATH}"
            /usr/bin/zip -qry "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}" Payload
          )

          ( cd "${EXPORT_PATH}" && shasum -a 256 "${UNSIGNED_IPA_NAME}" > "${UNSIGNED_IPA_NAME}.sha256" )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easytier-${{ env.BUILD_VERSION }}
          path: |
            ${{ runner.temp }}/export/${{ env.UNSIGNED_IPA_NAME }}
            ${{ runner.temp }}/export/${{ env.UNSIGNED_IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish release (one page per build number, keep newest 4)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # 2026-09-29 rewrite: replaced the single force-pushed "nightly"
          # rolling release (old build's ipa always gone once a new one
          # lands) with one release per Build number, mirroring what the
          # main EasyTier repo's publish-release.sh now does for
          # Windows/Android -- keeps the newest few builds individually
          # downloadable instead of only ever having "whatever's newest".

          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RELEASE_TAG="easytier-ios-build-${BUILD_NUM}"
          RELEASE_NOTES="${RUNNER_TEMP}/nightly-release-notes.md"

          {
            echo "Automated Release build from [\`${SHORT_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})."
            echo
            echo "- Build configuration: \`${BUILD_CONFIGURATION}\`"
            echo "- Code signing: none (genuinely unsigned, sign it yourself)"
            echo "- Built: ${BUILD_TIME}"
            echo "- Workflow run: [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo
            echo "> \`${UNSIGNED_IPA_NAME}\` is genuinely unsigned -- sign it yourself with your own Apple Developer account/provisioning profile (Xcode, AltStore, Sideloadly, etc.) before installing."
          } > "${RELEASE_NOTES}"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "release ${RELEASE_TAG} already exists (re-publishing the same commit) -- uploading into it"
            gh release upload "${RELEASE_TAG}" \
              "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}" \
              "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}.sha256" \
              --clobber
          else
            # 2026-09-29 real-run bug: the old workflow's release was always
            # --prerelease (it never tried to be GitHub's native "latest" --
            # that concept didn't exist for the old single-rolling-tag
            # model). Carried that flag over here at first without noticing
            # it's mutually exclusive with the `--latest` this step sets
            # right below -- first live run failed with "HTTP 422: Latest
            # release cannot be draft or prerelease." Dropped --prerelease;
            # these builds are still clearly labeled unsigned/nightly in the
            # notes above, and this repo has no separate "real" signed
            # release for --latest to wrongly steal prominence from.
            gh release create "${RELEASE_TAG}" \
              "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}" \
              "${EXPORT_PATH}/${UNSIGNED_IPA_NAME}.sha256" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "EasyTier iOS Build ${BUILD_NUM_PADDED}" \
              --notes-file "${RELEASE_NOTES}" \
              --latest=false
          fi
          gh release edit "${RELEASE_TAG}" --latest

          # Keep only the newest 4 (latest + 3 older). Deletes the GitHub
          # *release* (page + assets) only -- never the underlying
          # easytier-ios-build-<N> git tag, which is the permanent
          # build-number ledger from the step above and must never regress.
          PREFIX="easytier-ios-build-"
          gh release list --limit 200 --json tagName -q ".[] | select(.tagName | startswith(\"$PREFIX\")) | .tagName" \
            | sed "s/^$PREFIX//" | grep -E '^[0-9]+$' | sort -rn | tail -n +5 \
            | while read -r n; do
                old_tag="${PREFIX}${n}"
                echo "deleting old release beyond keep=4 (tag stays, counter unaffected): ${old_tag}"
                gh release delete "${old_tag}" --yes || true
              done

          # Separate, release-agnostic watermark for the check-for-changes
          # job above -- now that there's no single "nightly" release tag to
          # implicitly serve that purpose, force-push this dedicated one
          # instead, moved only on a successful publish (a failed run must
          # not mark today's commit as "already handled").
          git tag --force nightly-last-checked "${GITHUB_SHA}"
          git push --force origin refs/tags/nightly-last-checked
